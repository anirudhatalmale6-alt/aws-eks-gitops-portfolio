#
# Grafana dashboard as a ConfigMap
# ================================
# The Grafana sidecar in kube-prometheus-stack watches every namespace for
# ConfigMaps carrying the label grafana_dashboard: "1" and loads whatever JSON
# they contain. So a dashboard lives in git as a reviewable file, arrives
# through Argo CD like everything else, and survives Grafana being deleted and
# recreated.
#
# The alternative, building it by clicking in the Grafana UI, stores it in
# Grafana's own database. That database is on a PVC. Lose the PVC, lose every
# dashboard, with no record of what they contained.
#
# The datasource is a template variable rather than a hardcoded uid, because the
# Prometheus datasource uid is generated at install time and differs between
# clusters. Hardcoding it is why so many downloaded dashboards open empty.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-demo-app
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: eks-gitops-portfolio
data:
  demo-app.json: |
    {
      "title": "Demo app on EKS",
      "uid": "demo-app-eks",
      "tags": [
        "eks-gitops-portfolio",
        "demo-app"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "name": "Deploys",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "enable": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "expr": "changes(kube_deployment_status_observed_generation{namespace=\"demo\", deployment=\"demo-app\"}[1m]) > 0",
            "titleFormat": "Deployment rolled"
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Ready replicas",
          "description": "Pods currently in the Service endpoints. Compare with the PodDisruptionBudget line below.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "area",
            "colorMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "kube_deployment_status_replicas_ready{namespace=\"demo\", deployment=\"demo-app\"}",
              "legendFormat": "ready",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Desired replicas",
          "description": "What the HorizontalPodAutoscaler has asked for. A persistent gap against Ready means pods cannot be scheduled.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "area",
            "colorMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "kube_deployment_spec_replicas{namespace=\"demo\", deployment=\"demo-app\"}",
              "legendFormat": "desired",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Requests/sec",
          "description": "From the recording rule in the PrometheusRule, not computed live.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "area",
            "colorMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "demo_app:http_requests:rate5m",
              "legendFormat": "rps",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Active connections",
          "description": "Average across pods, from nginx stub_status via the exporter sidecar.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "area",
            "colorMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "demo_app:connections_active:avg",
              "legendFormat": "conns",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Restarts (1h)",
          "description": "Anything above zero outside a deploy window is worth reading the container log for.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 4
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "area",
            "colorMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"demo\", container=\"nginx\"}[1h]))",
              "legendFormat": "restarts",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Scrape targets up",
          "description": "Zero here means Prometheus has lost the app entirely, which is what the DemoAppAbsent alert watches for.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "area",
            "colorMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(up{job=\"demo-app\"})",
              "legendFormat": "up",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP requests per second, by pod",
          "description": "Broken out per pod so an uneven split tells you the ALB target group is not balancing, usually a readiness problem on one pod.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum by (pod) (rate(nginx_http_requests_total{job=\"demo-app\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "nginx connection states",
          "description": "Waiting climbing while active is flat means keep-alive connections held open, not load.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(nginx_connections_active{job=\"demo-app\"})",
              "legendFormat": "active",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(nginx_connections_waiting{job=\"demo-app\"})",
              "legendFormat": "waiting",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(nginx_connections_reading{job=\"demo-app\"})",
              "legendFormat": "reading",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(nginx_connections_writing{job=\"demo-app\"})",
              "legendFormat": "writing",
              "refId": "D"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU usage vs request",
          "description": "The HPA scales on usage as a percentage of the REQUEST, not of the node. This panel is that ratio, drawn.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"demo\", container=\"nginx\"}[5m]))",
              "legendFormat": "{{pod}} used",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(kube_pod_container_resource_requests{namespace=\"demo\", container=\"nginx\", resource=\"cpu\"})",
              "legendFormat": "total requested",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory working set vs limit",
          "description": "Working set touching the limit line is the moment before an OOMKill. There is no CPU limit on this container by design; memory has one.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"demo\", container=\"nginx\"})",
              "legendFormat": "{{pod}} used",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "min(kube_pod_container_resource_limits{namespace=\"demo\", container=\"nginx\", resource=\"memory\"})",
              "legendFormat": "limit",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pod lifecycle: ready, desired, PDB floor",
          "description": "Ready dipping below the PDB floor during a node drain or a SPOT reclaim is what DemoAppBelowDisruptionBudget alerts on.",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "kube_deployment_status_replicas_ready{namespace=\"demo\", deployment=\"demo-app\"}",
              "legendFormat": "ready",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "kube_deployment_spec_replicas{namespace=\"demo\", deployment=\"demo-app\"}",
              "legendFormat": "desired",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "kube_poddisruptionbudget_status_desired_healthy{namespace=\"demo\", poddisruptionbudget=\"demo-app\"}",
              "legendFormat": "PDB minimum",
              "refId": "C"
            }
          ]
        }
      ]
    }
